name: ebur128

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rustfmt-clippy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install stable
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: clippy, rustfmt

    - name: Run rustfmt
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: -- --check

    - name: Run clippy
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        args: --all-targets --all-features -- -D warnings

  cargo-c-tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v2

    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install valgrind

    - name: Install ${{ matrix.toolchain }}
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.toolchain }}
        override: true

    - name: Install cargo-c
      env:
        LINK: https://github.com/lu-zero/cargo-c/releases/download
        CARGO_C_VERSION: 0.9.13
      run: |
        curl -L "$LINK/v$CARGO_C_VERSION/cargo-c-linux.tar.gz" |
        tar xz -C $HOME/.cargo/bin

    - name: Run cargo-c
      run: |
        cargo cinstall --prefix=$HOME/install

    - name: Set pkg-config path
      run: |
        INSTALL_PATH=$HOME/install/lib/pkgconfig
        echo "PKG_CONFIG_PATH=$INSTALL_PATH" >> $GITHUB_ENV

    - name: Check capi
      run: |
        make -C capi-test check

    - name: Check capi valgrind
      run: |
        make -C capi-test check-valgrind

  ubuntu-tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v2

    # tech.ebu.ch rejects non-browser downloads from cloud IPs with 403, so
    # use this GitHub mirror.
    - name: Download samples
      env:
        LINK: https://github.com/maxwalley/EBULoudnessTestSetV5/releases/download/EBU_Loudness_Test_Set_v5
      run: |
        wget $LINK/ebu-loudness-test-setv05.zip
        echo "9cc500b4df83f7c21855c74dce795ef5209a752bf884253ae57d0ce512efb062  ebu-loudness-test-setv05.zip" | sha256sum -c
        unzip -u ebu-loudness-test-setv05.zip -d tests/reference_files

    - name: Install ${{ matrix.toolchain }}
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.toolchain }}
        override: true

    - name: Run tests
      env:
        QUICKCHECK_TESTS: 2
      run: |
        cargo test --features c-tests,internal-tests,reference-tests

  msrv-ubuntu-tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: ['1.60']

    steps:
    - uses: actions/checkout@v2

    - name: Install ${{ matrix.toolchain }}
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.toolchain }}
        override: true

    - name: Use MSRV Cargo.lock
      run: cp Cargo.lock.msrv Cargo.lock

    - name: Run cargo check
      run: |
        cargo check
